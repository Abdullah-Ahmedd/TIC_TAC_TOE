name: Build and Test C/C++ Project with Makefile

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v3

    - name: 🛠 Install Build Tools
      run: sudo apt update && sudo apt install -y build-essential make

    - name: 🔧 Build Project using Makefile
      run: make

    - name: 🚀 Run Smoke Test (if applicable)
      run: |
        echo "Running the program..."
        ./app.out <<EOF
        2
        testuser
        1234
        4
        EOF

    - name: 📦 Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: compiled-app
        path: ./app.out
