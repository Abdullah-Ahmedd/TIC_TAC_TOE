# .github/workflows/cpp-ci.yml
name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ cmake

    - name: Build project
      run: |
        mkdir -p build
        cd build
        g++ ../tictactoe.cpp -o tictactoe.out
        ls -lh

    - name: Run basic test (optional)
      run: |
        ./build/tictactoe.out << EOF
        2
        testuser
        1234
        4
        EOF
