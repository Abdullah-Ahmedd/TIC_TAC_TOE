# .github/workflows/ci-cd.yml
name: TIC_TAC_TOE CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release
  CC: gcc
  CXX: g++

jobs:
  # Analyze project structure
  analyze:
    name: Analyze Project Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Analyze project structure
      run: |
        echo "=== Project Structure Analysis ==="
        echo "Root directory contents:"
        ls -la
        echo ""
        
        echo "Looking for source files:"
        find . -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" | head -10
        echo ""
        
        echo "Looking for header files:"
        find . -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" | head -10
        echo ""
        
        echo "Looking for build files:"
        ls -la CMakeLists.txt Makefile makefile 2>/dev/null || echo "No standard build files found"
        echo ""
        
        echo "Directory structure:"
        tree . 2>/dev/null || find . -type d | head -20

  # Code quality checks
  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install clang-format and clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy tree
        
    - name: Check if source files exist
      run: |
        SOURCE_FILES=$(find . -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cxx")
        if [ -z "$SOURCE_FILES" ]; then
          echo "No C/C++ source files found in the repository"
          echo "Skipping code quality checks"
          exit 0
        fi
        echo "Found source files:"
        echo "$SOURCE_FILES"
        
    - name: Check code formatting (if source files exist)
      run: |
        SOURCE_FILES=$(find . -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cxx")
        if [ -n "$SOURCE_FILES" ]; then
          echo "$SOURCE_FILES" | xargs clang-format --dry-run --Werror || \
          (echo "Code formatting issues found. Run clang-format to fix." && exit 1)
        else
          echo "No source files to format"
        fi
        
    - name: Run clang-tidy (if .clang-tidy exists)
      run: |
        SOURCE_FILES=$(find . -name "*.cpp" -o -name "*.c" -o -name "*.cc" -o -name "*.cxx")
        if [ -f ".clang-tidy" ] && [ -n "$SOURCE_FILES" ]; then
          echo "$SOURCE_FILES" | xargs clang-tidy --warnings-as-errors=*
        else
          echo "No .clang-tidy configuration found or no source files, skipping static analysis"
        fi

  # Build and test
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    needs: [analyze, lint-and-format]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
      fail-fast: false
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install build dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build valgrind tree
        
    - name: Install build dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake ninja
        
    - name: Install build dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake ninja
        
    - name: Debug - Show project structure
      run: |
        echo "=== Current directory ==="
        pwd
        ls -la
        echo ""
        echo "=== Looking for source files ==="
        find . -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "main.*" 2>/dev/null || echo "No source files found"
        echo ""
        echo "=== Looking for build files ==="
        ls -la CMakeLists.txt Makefile makefile *.mk 2>/dev/null || echo "No build files found"
      shell: bash
      
    - name: Detect build system and source files
      id: detect
      run: |
        # Check for CMakeLists.txt
        if [ -f "CMakeLists.txt" ]; then
          echo "cmake=true" >> $GITHUB_OUTPUT
          echo "Found CMakeLists.txt"
        else
          echo "cmake=false" >> $GITHUB_OUTPUT
        fi
        
        # Check for Makefile
        if [ -f "Makefile" ] || [ -f "makefile" ]; then
          echo "makefile=true" >> $GITHUB_OUTPUT
          echo "Found Makefile"
        else
          echo "makefile=false" >> $GITHUB_OUTPUT
        fi
        
        # Find source files
        SOURCE_FILES=""
        MAIN_FILE=""
        
        # Look for main files
        for main_file in main.c main.cpp src/main.c src/main.cpp; do
          if [ -f "$main_file" ]; then
            MAIN_FILE="$main_file"
            echo "Found main file: $main_file"
            break
          fi
        done
        
        # Look for any source files
        SOURCE_FILES=$(find . -maxdepth 2 -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" | head -10 | tr '\n' ' ')
        
        if [ -n "$MAIN_FILE" ]; then
          echo "main_file=$MAIN_FILE" >> $GITHUB_OUTPUT
          echo "has_sources=true" >> $GITHUB_OUTPUT
        elif [ -n "$SOURCE_FILES" ]; then
          echo "source_files=$SOURCE_FILES" >> $GITHUB_OUTPUT
          echo "has_sources=true" >> $GITHUB_OUTPUT
        else
          echo "has_sources=false" >> $GITHUB_OUTPUT
          echo "No source files found!"
        fi
      shell: bash
      
    - name: Configure CMake
      if: steps.detect.outputs.cmake == 'true'
      run: |
        mkdir -p build
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -G Ninja
      
    - name: Build with CMake
      if: steps.detect.outputs.cmake == 'true'
      run: |
        cmake --build build --config ${{ matrix.build_type }}
        echo "CMake build completed"
        ls -la build/
      
    - name: Build with Makefile
      if: steps.detect.outputs.makefile == 'true' && steps.detect.outputs.cmake == 'false'
      run: |
        mkdir -p build
        make
        # Try to find the executable and copy to build directory
        find . -maxdepth 1 -type f -executable ! -name "*.sh" -exec cp {} build/ \;
        ls -la build/
      shell: bash
      
    - name: Build manually (fallback)
      if: steps.detect.outputs.has_sources == 'true' && steps.detect.outputs.cmake == 'false' && steps.detect.outputs.makefile == 'false'
      run: |
        mkdir -p build
        
        # Try to compile main file
        if [ -n "${{ steps.detect.outputs.main_file }}" ]; then
          MAIN_FILE="${{ steps.detect.outputs.main_file }}"
          echo "Compiling main file: $MAIN_FILE"
          
          if [[ "$MAIN_FILE" == *.cpp ]] || [[ "$MAIN_FILE" == *.cc ]] || [[ "$MAIN_FILE" == *.cxx ]]; then
            # C++ compilation
            OUTPUT_NAME="tictactoe"
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              OUTPUT_NAME="tictactoe.exe"
            fi
            
            # Try to compile with all cpp files in the same directory
            CPP_DIR=$(dirname "$MAIN_FILE")
            g++ -std=c++17 -Wall -Wextra -O2 "$CPP_DIR"/*.cpp -o "build/$OUTPUT_NAME" 2>/dev/null || \
            g++ -std=c++17 -Wall -Wextra -O2 "$MAIN_FILE" -o "build/$OUTPUT_NAME" || \
            echo "C++ compilation failed"
          else
            # C compilation
            OUTPUT_NAME="tictactoe"
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              OUTPUT_NAME="tictactoe.exe"
            fi
            
            # Try to compile with all c files in the same directory
            C_DIR=$(dirname "$MAIN_FILE")
            gcc -std=c99 -Wall -Wextra -O2 "$C_DIR"/*.c -o "build/$OUTPUT_NAME" 2>/dev/null || \
            gcc -std=c99 -Wall -Wextra -O2 "$MAIN_FILE" -o "build/$OUTPUT_NAME" || \
            echo "C compilation failed"
          fi
        else
          echo "No main file found for manual compilation"
        fi
        
        echo "Build directory contents:"
        ls -la build/
      shell: bash
      
    - name: Verify executable was created
      run: |
        echo "Checking for executable files in build directory:"
        ls -la build/
        
        # Look for any executable files
        EXECUTABLES=$(find build -type f -executable 2>/dev/null || find build -name "*.exe" 2>/dev/null || echo "")
        
        if [ -n "$EXECUTABLES" ]; then
          echo "Found executables:"
          echo "$EXECUTABLES"
          echo "executable_found=true" >> $GITHUB_ENV
        else
          echo "No executables found"
          echo "executable_found=false" >> $GITHUB_ENV
        fi
      shell: bash
      
    - name: Test executable (if found)
      if: env.executable_found == 'true'
      run: |
        echo "Testing executable..."
        # Find the executable
        EXECUTABLE=$(find build -type f -executable | head -1)
        if [ -z "$EXECUTABLE" ]; then
          EXECUTABLE=$(find build -name "*.exe" | head -1)
        fi
        
        if [ -n "$EXECUTABLE" ]; then
          echo "Running: $EXECUTABLE --help"
          "$EXECUTABLE" --help 2>/dev/null || echo "Executable exists but doesn't support --help"
        fi
      shell: bash
      
    - name: Upload build artifacts (if any exist)
      uses: actions/upload-artifact@v4
      if: env.executable_found == 'true'
      with:
        name: tictactoe-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/*
        retention-days: 30
        
    - name: Upload build artifacts (attempt even if no executables)
      uses: actions/upload-artifact@v4
      if: env.executable_found == 'false'
      continue-on-error: true
      with:
        name: build-attempt-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/
          *.o
          *.obj
        retention-days: 7

  # Package for release
  package:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [lint-and-format, build-and-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      
    - name: Create release package
      run: |
        mkdir -p release
        
        # List all downloaded artifacts
        echo "Downloaded artifacts:"
        ls -la
        
        # Find and copy any executables
        find . -name "tictactoe*" -type f -exec cp {} release/ \; 2>/dev/null || echo "No tictactoe executables found"
        find . -name "*.exe" -type f -exec cp {} release/ \; 2>/dev/null || echo "No .exe files found"
        
        # Check if we have any files to package
        if [ "$(ls -A release/)" ]; then
          echo "Files to package:"
          ls -la release/
          
          # Create packages
          tar -czf tictactoe-release.tar.gz release/
          zip -r tictactoe-release.zip release/
        else
          echo "No files found to package, creating empty package"
          echo "No executables were built successfully" > release/README.txt
          tar -czf tictactoe-release.tar.gz release/
          zip -r tictactoe-release.zip release/
        fi
        
    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: |
          tictactoe-release.tar.gz
          tictactoe-release.zip
        retention-days: 90

  # Deploy to staging (example)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: release-package
        
    - name: Deploy to staging server
      run: |
        echo "Deploying TIC_TAC_TOE to staging environment..."
        echo "Available files: $(ls -la)"
        # Example deployment commands:
        # scp tictactoe-release.tar.gz user@staging-server:/opt/tictactoe/
        # ssh user@staging-server 'cd /opt/tictactoe && tar -xzf tictactoe-release.tar.gz'
        # ssh user@staging-server 'systemctl restart tictactoe-service'
        
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # ./smoke-tests.sh staging-server

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: release-package
        
    - name: Deploy to production
      run: |
        echo "Deploying TIC_TAC_TOE to production environment..."
        echo "Available files: $(ls -la)"
        # Add your production deployment commands here
        
    - name: Health check
      run: |
        echo "Running health checks on production..."
        # Add health check commands here

  # Create GitHub release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.event_name == 'release'
    
    steps:
    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: release-package
        
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./tictactoe-release.tar.gz
        asset_name: tictactoe-${{ github.event.release.tag_name }}-linux.tar.gz
        asset_content_type: application/gzip
        
    - name: Upload Windows release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./tictactoe-release.zip
        asset_name: tictactoe-${{ github.event.release.tag_name }}-windows.zip
        asset_content_type: application/zip
