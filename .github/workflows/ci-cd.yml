name: TIC_TAC_TOE CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  setup:
    name: Setup and Install Dependencies
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v3
      env:
        cache-name: cache-node-modules
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package*.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-
    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then npm ci
        elif [ -f "yarn.lock" ]; then yarn install --frozen-lockfile
        elif [ -f "package.json" ]; then npm install
        else echo "No package.json found, skipping npm install"

  build-cpp:
    name: Build C/C++ Code
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install build tools
      run: sudo apt update && sudo apt install -y build-essential
    - name: Build using Makefile or fallback
      run: |
        if [ -f Makefile ]; then make
        else
          echo "No Makefile found. Attempting g++ compilation."
          mkdir -p build
          g++ -Wall -Werror *.cpp *.c -o build/app.out

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: build-cpp
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: tic-tac-toe-binary
        path: |
          build/
          *.out
