# .github/workflows/ci-cd.yml
name: TIC_TAC_TOE CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release
  CC: gcc
  CXX: g++

jobs:
  # Setup and build matrix for different platforms
  setup:
    name: Setup Build Environment
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        compiler: [gcc, clang]
        exclude:
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang
          - os: macos-latest
            compiler: gcc
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi
        
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake ninja
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          brew install llvm
        fi
        
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake ninja
        
    - name: Set up compiler environment
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        else
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        fi
      shell: bash

  # Code quality checks
  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install clang-format and clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy
        
    - name: Check code formatting
      run: |
        find . -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" | \
        xargs clang-format --dry-run --Werror || \
        (echo "Code formatting issues found. Run clang-format to fix." && exit 1)
        
    - name: Run clang-tidy (if .clang-tidy exists)
      run: |
        if [ -f ".clang-tidy" ]; then
          find . -name "*.cpp" -o -name "*.c" | \
          xargs clang-tidy --warnings-as-errors=*
        else
          echo "No .clang-tidy configuration found, skipping static analysis"
        fi
        
    - name: Check for common issues
      run: |
        echo "Checking for common C/C++ issues..."
        # Check for basic issues
        if grep -r "printf.*%s.*NULL" . --include="*.c" --include="*.cpp"; then
          echo "Warning: Potential NULL pointer dereference with printf %s"
        fi

  # Build and test
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    needs: [setup]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install build dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build valgrind
        
    - name: Install build dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake ninja
        
    - name: Install build dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake ninja
        
    - name: Configure CMake (if CMakeLists.txt exists)
      run: |
        if [ -f "CMakeLists.txt" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -G Ninja
        else
          echo "No CMakeLists.txt found, will use direct compilation"
          mkdir -p build
        fi
      shell: bash
      
    - name: Build with CMake
      if: hashFiles('CMakeLists.txt') != ''
      run: cmake --build build --config ${{ matrix.build_type }}
      
    - name: Build without CMake (fallback)
      if: hashFiles('CMakeLists.txt') == ''
      run: |
        echo "Building without CMake..."
        mkdir -p build
        # Try to find main source files and compile
        if [ -f "main.cpp" ]; then
          g++ -std=c++17 -Wall -Wextra -O2 main.cpp -o build/tictactoe
        elif [ -f "main.c" ]; then
          gcc -std=c99 -Wall -Wextra -O2 main.c -o build/tictactoe
        elif [ -f "src/main.cpp" ]; then
          g++ -std=c++17 -Wall -Wextra -O2 src/*.cpp -o build/tictactoe
        elif [ -f "src/main.c" ]; then
          gcc -std=c99 -Wall -Wextra -O2 src/*.c -o build/tictactoe
        else
          echo "No main source file found. Please ensure you have main.c, main.cpp, or src/main.c, src/main.cpp"
          find . -name "*.c" -o -name "*.cpp" | head -5
        fi
      shell: bash
      
    - name: Run tests (if test directory exists)
      run: |
        if [ -d "tests" ] || [ -d "test" ]; then
          echo "Running tests..."
          # If using CMake with tests
          if [ -f "CMakeLists.txt" ] && [ -f "build/test_tictactoe" ]; then
            ./build/test_tictactoe
          # If using CMake with CTest
          elif [ -f "CMakeLists.txt" ]; then
            cd build && ctest --output-on-failure
          # Manual test compilation and run
          elif [ -f "tests/test_main.cpp" ]; then
            g++ -std=c++17 -Wall -Wextra tests/*.cpp -o build/test_tictactoe
            ./build/test_tictactoe
          elif [ -f "test/test_main.c" ]; then
            gcc -std=c99 -Wall -Wextra test/*.c -o build/test_tictactoe
            ./build/test_tictactoe
          fi
        else
          echo "No tests directory found, skipping tests"
        fi
      shell: bash
      
    - name: Run memory check (Ubuntu Debug only)
      if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
      run: |
        if [ -f "build/tictactoe" ]; then
          echo "Running memory check with valgrind..."
          valgrind --tool=memcheck --leak-check=full --error-exitcode=1 ./build/tictactoe --help || echo "Valgrind check completed"
        fi
      shell: bash
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tictactoe-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/tictactoe*
          build/*.exe
        retention-days: 30

  # Package for release
  package:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [lint-and-format, build-and-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release package
      run: |
        mkdir -p release
        # Copy executables from different platforms
        find . -name "tictactoe*" -executable -type f -exec cp {} release/ \;
        find . -name "*.exe" -type f -exec cp {} release/ \;
        
        # Create tarball
        tar -czf tictactoe-release.tar.gz release/
        
        # Create zip for Windows users
        zip -r tictactoe-release.zip release/
        
    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: |
          tictactoe-release.tar.gz
          tictactoe-release.zip
        retention-days: 90

  # Deploy to staging (example)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: release-package
        
    - name: Deploy to staging server
      run: |
        echo "Deploying TIC_TAC_TOE to staging environment..."
        echo "Available files: $(ls -la)"
        # Example deployment commands:
        # scp tictactoe-release.tar.gz user@staging-server:/opt/tictactoe/
        # ssh user@staging-server 'cd /opt/tictactoe && tar -xzf tictactoe-release.tar.gz'
        # ssh user@staging-server 'systemctl restart tictactoe-service'
        
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # ./smoke-tests.sh staging-server

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: release-package
        
    - name: Deploy to production
      run: |
        echo "Deploying TIC_TAC_TOE to production environment..."
        echo "Available files: $(ls -la)"
        # Add your production deployment commands here
        
    - name: Health check
      run: |
        echo "Running health checks on production..."
        # Add health check commands here

  # Create GitHub release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.event_name == 'release'
    
    steps:
    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: release-package
        
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./tictactoe-release.tar.gz
        asset_name: tictactoe-${{ github.event.release.tag_name }}-linux.tar.gz
        asset_content_type: application/gzip
        
    - name: Upload Windows release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./tictactoe-release.zip
        asset_name: tictactoe-${{ github.event.release.tag_name }}-windows.zip
        asset_content_type: application/zip
