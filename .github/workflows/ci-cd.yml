# .github/workflows/ci-cd.yml
name: TIC_TAC_TOE CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release
  CXX_STANDARD: 17

jobs:
  # Setup and check repository structure
  setup:
    name: Setup and Repository Check
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.find-folders.outputs.folders }}
      has_cmake: ${{ steps.check-build-system.outputs.has_cmake }}
      has_makefile: ${{ steps.check-build-system.outputs.has_makefile }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Find C/C++ source folders
      id: find-folders
      run: |
        echo "Scanning for C/C++ source folders..."
        folders=$(find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \) -exec dirname {} \; | sort | uniq | grep -v "^\.$" | sed 's|^\./||' | jq -R -s -c 'split("\n")[:-1]')
        if [ "$folders" = "[]" ]; then
          folders='["./"]'
        fi
        echo "folders=$folders" >> $GITHUB_OUTPUT
        echo "Found folders: $folders"
        
    - name: Check build system
      id: check-build-system
      run: |
        if [ -f "CMakeLists.txt" ] || find . -name "CMakeLists.txt" | head -1; then
          echo "has_cmake=true" >> $GITHUB_OUTPUT
          echo "CMake build system detected"
        else
          echo "has_cmake=false" >> $GITHUB_OUTPUT
        fi
        
        if [ -f "Makefile" ] || find . -name "Makefile" | head -1; then
          echo "has_makefile=true" >> $GITHUB_OUTPUT
          echo "Makefile build system detected"
        else
          echo "has_makefile=false" >> $GITHUB_OUTPUT
        fi

  # Code quality and static analysis
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install static analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang-tidy clang-format
        
    - name: Run cppcheck
      run: |
        echo "Running cppcheck static analysis..."
        find . -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" | xargs cppcheck --enable=all --inconclusive --xml --xml-version=2 2> cppcheck.xml || true
        if [ -s cppcheck.xml ]; then
          echo "Cppcheck found potential issues:"
          cat cppcheck.xml
        else
          echo "No issues found by cppcheck"
        fi
        
    - name: Check code formatting
      run: |
        echo "Checking code formatting..."
        find . -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.h" -o -name "*.hpp" | while read file; do
          if [ -f "$file" ]; then
            clang-format --dry-run --Werror "$file" 2>/dev/null || echo "Format issue in: $file"
          fi
        done
        
    - name: Upload static analysis results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: static-analysis-results
        path: |
          cppcheck.xml
        retention-days: 30

  # Build with different compilers
  build-gcc:
    name: Build with GCC
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        gcc-version: [9, 11, 12]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install GCC ${{ matrix.gcc-version }}
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.gcc-version }} g++-${{ matrix.gcc-version }}
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.gcc-version }} 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.gcc-version }} 100
        
    - name: Install CMake
      if: needs.setup.outputs.has_cmake == 'true'
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.20'
        
    - name: Build with CMake
      if: needs.setup.outputs.has_cmake == 'true'
      run: |
        echo "Building with CMake..."
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }}
        make -j$(nproc)
        
    - name: Build with Makefile
      if: needs.setup.outputs.has_makefile == 'true' && needs.setup.outputs.has_cmake == 'false'
      run: |
        echo "Building with Makefile..."
        make -j$(nproc) CXXFLAGS="-std=c++${{ env.CXX_STANDARD }} -O2"
        
    - name: Build individual folders
      if: needs.setup.outputs.has_cmake == 'false' && needs.setup.outputs.has_makefile == 'false'
      run: |
        echo "Building individual C/C++ files in folders..."
        folders='${{ needs.setup.outputs.folders }}'
        echo "$folders" | jq -r '.[]' | while read folder; do
          if [ -d "$folder" ]; then
            echo "Building in folder: $folder"
            cd "$folder"
            
            # Find all C/C++ source files
            cpp_files=$(find . -maxdepth 1 -name "*.cpp" -o -name "*.cc" -o -name "*.cxx")
            c_files=$(find . -maxdepth 1 -name "*.c")
            
            # Build C++ files
            if [ -n "$cpp_files" ]; then
              echo "$cpp_files" | while read file; do
                if [ -f "$file" ]; then
                  output_name=$(basename "$file" .cpp)
                  output_name=$(basename "$output_name" .cc)
                  output_name=$(basename "$output_name" .cxx)
                  echo "Compiling $file -> $output_name"
                  g++ -std=c++${{ env.CXX_STANDARD }} -O2 -Wall -Wextra "$file" -o "$output_name" || echo "Failed to compile $file"
                fi
              done
            fi
            
            # Build C files
            if [ -n "$c_files" ]; then
              echo "$c_files" | while read file; do
                if [ -f "$file" ]; then
                  output_name=$(basename "$file" .c)
                  echo "Compiling $file -> $output_name"
                  gcc -std=c11 -O2 -Wall -Wextra "$file" -o "$output_name" || echo "Failed to compile $file"
                fi
              done
            fi
            
            cd - > /dev/null
          fi
        done
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-gcc-${{ matrix.gcc-version }}
        path: |
          build/
          **/tictactoe*
          **/*.exe
          **/*.out
        retention-days: 30

  # Build with Clang
  build-clang:
    name: Build with Clang
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libc++-dev libc++abi-dev
        
    - name: Install CMake
      if: needs.setup.outputs.has_cmake == 'true'
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.20'
        
    - name: Build with CMake and Clang
      if: needs.setup.outputs.has_cmake == 'true'
      run: |
        echo "Building with CMake and Clang..."
        mkdir -p build-clang
        cd build-clang
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
        make -j$(nproc)
        
    - name: Build with Makefile and Clang
      if: needs.setup.outputs.has_makefile == 'true' && needs.setup.outputs.has_cmake == 'false'
      run: |
        echo "Building with Makefile and Clang..."
        make -j$(nproc) CXX=clang++ CC=clang CXXFLAGS="-std=c++${{ env.CXX_STANDARD }} -O2"

  # Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build-gcc, code-quality]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-gcc-11
        
    - name: Make executables executable
      run: |
        find . -type f -name "*tictactoe*" -exec chmod +x {} \;
        find . -type f -name "*.out" -exec chmod +x {} \;
        
    - name: Run basic tests
      run: |
        echo "Running basic functionality tests..."
        
        # Find and run executables
        find . -type f \( -name "*tictactoe*" -o -name "*.out" \) -executable | while read exec; do
          if [ -x "$exec" ]; then
            echo "Testing executable: $exec"
            timeout 10s "$exec" --help 2>/dev/null || echo "Executable $exec ran (help not available)"
            # Add more specific tests here based on your game's interface
          fi
        done
        
    - name: Run unit tests (if available)
      run: |
        if [ -d "tests" ] || [ -d "test" ]; then
          echo "Running unit tests..."
          # Add commands to run your unit tests here
          # For example: ./test_runner or ctest
        else
          echo "No test directory found, skipping unit tests"
        fi

  # Memory check with Valgrind
  memory-check:
    name: Memory Check
    runs-on: ubuntu-latest
    needs: [build-gcc]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind
        
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-gcc-11
        
    - name: Make executables executable
      run: |
        find . -type f -name "*tictactoe*" -exec chmod +x {} \;
        find . -type f -name "*.out" -exec chmod +x {} \;
        
    - name: Run Valgrind memory check
      run: |
        echo "Running Valgrind memory checks..."
        find . -type f \( -name "*tictactoe*" -o -name "*.out" \) -executable | while read exec; do
          if [ -x "$exec" ]; then
            echo "Memory checking: $exec"
            timeout 30s valgrind --tool=memcheck --leak-check=full --show-leak-kinds=all --track-origins=yes "$exec" --version 2>&1 | tee "valgrind-$(basename $exec).log" || echo "Valgrind check completed for $exec"
          fi
        done
        
    - name: Upload Valgrind results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: valgrind-results
        path: |
          valgrind-*.log
        retention-days: 30

  # Create release package
  package:
    name: Create Release Package
    runs-on: ubuntu-latest
    needs: [build-gcc, build-clang, test, memory-check]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release package
      run: |
        mkdir -p release-package
        
        # Copy source code
        cp -r ./* release-package/ 2>/dev/null || true
        
        # Copy executables
        find . -name "build-artifacts-*" -type d | while read dir; do
          find "$dir" -type f \( -name "*tictactoe*" -o -name "*.out" \) -executable -exec cp {} release-package/ \;
        done
        
        # Create README for release
        cat > release-package/RELEASE_README.md << EOF
# TIC_TAC_TOE Release Package

This package contains the compiled TIC_TAC_TOE game executables and source code.

## Contents
- Source code in various folders
- Compiled executables
- Build artifacts

## How to Run
1. Make sure the executable has proper permissions: \`chmod +x tictactoe\`
2. Run the game: \`./tictactoe\`

## Build Information
- Built on: $(date)
- Commit: ${{ github.sha }}
- Branch: ${{ github.ref_name }}
EOF
        
        # Create archive
        tar -czf tictactoe-release-${{ github.sha }}.tar.gz release-package/
        
    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: tictactoe-release-package
        path: |
          tictactoe-release-*.tar.gz
        retention-days: 90

  # Notification
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [package]
    if: always()
    
    steps:
    - name: Notify build status
      run: |
        if [ "${{ needs.package.result }}" = "success" ]; then
          echo "🎉 TIC_TAC_TOE build completed successfully!"
          echo "✅ All C/C++ code compiled without errors"
          echo "✅ Static analysis passed"
          echo "✅ Memory checks completed"
          echo "📦 Release package created"
        else
          echo "❌ TIC_TAC_TOE build failed"
          echo "Please check the logs for details"
        fi
        
        echo "Build completed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
